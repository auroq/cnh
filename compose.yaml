name: widedoor

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      xpack.ml.enabled: "true"
      xpack.ml.use_auto_machine_memory_percent: "true"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-widedoor-dev}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ES_PORT:-19200}:9200"
    mem_limit: 6g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  es-data:
