apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: {{ .Release.Namespace }}
      sectionName: https
  hostnames:
    - argocd.{{ .Values.domain }}
  rules:
    - backendRefs:
        - name: argo-cd-argocd-server
          port: 80
