apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-es
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: sandbox
  namespace: sandbox-es
spec:
  version: 9.5.6
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests: { memory: 8Gi, cpu: "2" }
                limits: { memory: 8Gi }
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: do-block-storage
            resources:
              requests:
                storage: 20Gi
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: sandbox
  namespace: sandbox-es
spec:
  version: 9.5.6
  count: 1
  elasticsearchRef:
    name: sandbox
