apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-demo
    targetRevision: 0.42.6
    helm:
      valuesObject:
        opentelemetry-collector:
          extraEnvs:
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-export
                  key: token
          config:
            exporters:
              otlp_grpc/dash0:
                endpoint: ingress.us-west-2.aws.dash0.com:4317
                headers:
                  Authorization: Bearer ${env:DASH0_AUTH_TOKEN}
                  Dash0-Dataset: otel-demo
                sending_queue:
                  batch: {}
            service:
              pipelines:
                traces:
                  exporters: [otlp_grpc/jaeger, otlp_grpc/dash0, debug, span_metrics]
                metrics:
                  exporters: [otlp_http/prometheus, otlp_grpc/dash0, debug]
                logs:
                  exporters: [opensearch, otlp_grpc/dash0, debug]
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
