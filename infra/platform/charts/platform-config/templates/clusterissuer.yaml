apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: {{ .Values.doTokenSecret.name }}
              key: token
