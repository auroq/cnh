name: images
on:
  push:
    branches: [main]
    paths: [cmd/**, pkg/**, go.mod, go.sum, Dockerfile, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [ingest, widedoor]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CMD=${{ matrix.cmd }}
          push: true
          tags: |
            ghcr.io/auroq/cnh/${{ matrix.cmd }}:main
            ghcr.io/auroq/cnh/${{ matrix.cmd }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
