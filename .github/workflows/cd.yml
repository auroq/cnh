name: cd
# How a change reaches production (ADR 0008):
#   1. a PR merges to main when CI and Gitar pass
#   2. CI runs again on main; when it succeeds this workflow starts
#   3. build: the image is built and pushed, tagged with the commit SHA
#   4. bump: a PR pins that SHA in deploy/app/kustomization.yaml and auto-merges once CI passes
#   5. gate: wait for Argo CD and the Deployment, then run the browser accessibility tests and the acceptance checks against the live site
#   6. rollback: if the gate fails, a PR reverts the bump and auto-merges; git stays the source of truth
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: cd-main
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/auroq/cnh/widedoor
defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: plan
        name: Decide what this commit needs
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          subject=$(git log -1 --format=%s "$sha")
          if [[ "$subject" == deploy:\ images\ at* || "$subject" == deploy:\ revert\ images\ at* ]]; then
            echo "this is a bump or a revert; the gate alone runs"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pinned=$(grep -m1 -oE 'newTag: [0-9a-f]{40}' deploy/app/kustomization.yaml | cut -d' ' -f2)
          echo "pinned image build: $pinned"
          if [[ "$pinned" == "$sha" ]]; then
            echo "main is already live; the gate checks the live site"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$pinned" "$sha" | grep -qE '^(cmd/|pkg/|data/|go\.mod|go\.sum|Dockerfile)'; then
            echo "code differs between the live build and main; build and release"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "no code change since the live build; the gate checks the live site"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ needs.plan.outputs.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ needs.plan.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.bump.outputs.pr }}
      merge: ${{ steps.wait.outputs.merge }}
    env:
      GH_TOKEN: ${{ secrets.CD_GITHUB_TOKEN }}
      REMOTE: origin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.CD_GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Open the bump PR
        id: bump
        run: |
          git config user.name "wide-door-cd"
          git config user.email "cd@cnh.auroq.com"
          out=$(tools/bump-image.sh --sha "${{ needs.plan.outputs.sha }}")
          echo "$out"
          if grep -q '^already pinned' <<<"$out"; then
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "image already pinned to this SHA; nothing to bump" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(grep -m1 'https://github.com/.*/pull/' <<<"$out")
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "bump PR: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for it to merge
        id: wait
        if: steps.bump.outputs.pr != ''
        run: |
          merge=$(tools/wait-pr.sh "${{ steps.bump.outputs.pr }}" --timeout 1200 | tail -1)
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

  gate:
    needs: [plan, build, bump]
    if: always() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.bump.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: azure/setup-kubectl@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Kubeconfig for the cd-gate ServiceAccount
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$CD_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        env:
          CD_KUBECONFIG: ${{ secrets.CD_KUBECONFIG }}
      - name: Wait for the Deployment to be available on the released image
        run: |
          if [[ "${{ needs.plan.outputs.release }}" == "true" ]]; then
            image="${IMAGE}:${{ needs.plan.outputs.sha }}"
          else
            image=$(kubectl kustomize deploy/app | grep -m1 -oE "${IMAGE}:[0-9a-f]{40}")
          fi
          tools/wait-deployment.sh --image "$image" --timeout 900 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: testing/e2e/package-lock.json
      - name: Browser accessibility tests against the live site
        working-directory: testing/e2e
        env:
          WIDEDOOR_URL: https://widedoor.cnh.auroq.com
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/testing/e2e/.cache/ms-playwright
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          npx playwright test 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Axe reports and Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-accessibility
          path: |
            testing/e2e/test-results
            testing/e2e/playwright-report
          if-no-files-found: ignore
      - name: Acceptance against the live site
        run: |
          if [[ -d testing/acceptance ]]; then
            WIDEDOOR_URL=https://widedoor.cnh.auroq.com go test ./testing/acceptance/... 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tools/smoke.sh https://widedoor.cnh.auroq.com 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  rollback:
    needs: [plan, bump, gate]
    if: always() && needs.plan.outputs.release == 'true' && needs.bump.result == 'success' && needs.bump.outputs.pr != '' && needs.gate.result == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CD_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.CD_GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: azure/setup-kubectl@v4
      - name: Revert the bump through a PR
        run: |
          git config user.name "wide-door-cd"
          git config user.email "cd@cnh.auroq.com"
          short="${{ needs.plan.outputs.sha }}"; short="${short:0:7}"
          git checkout -b "deploy/revert-$short"
          git revert --no-edit "${{ needs.bump.outputs.merge }}"
          git commit --amend -q -m "deploy: revert images at $short" -m "The post-deploy gate failed on this release (run ${{ github.run_id }}); the previous image is pinned again."
          git push -u origin "deploy/revert-$short"
          url=$(tools/pr.sh --title "deploy: revert images at $short" --body "The post-deploy gate failed for ${{ needs.plan.outputs.sha }} (workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). This pins the previous image again; Argo CD's self-heal rolls the cluster back. Reverts #${{ needs.bump.outputs.pr }}." | grep -m1 'https://github.com/.*/pull/')
          echo "revert PR: $url" >> "$GITHUB_STEP_SUMMARY"
          tools/wait-pr.sh "${url##*/}" --timeout 1200
      - name: Confirm the previous image is available again
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$CD_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          image=$(kubectl kustomize deploy/app | grep -m1 -oE "${IMAGE}:[0-9a-f]{40}")
          tools/wait-deployment.sh --image "$image" --timeout 900 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          CD_KUBECONFIG: ${{ secrets.CD_KUBECONFIG }}
      - name: Say so on the bump PR
        run: |
          gh pr comment "${{ needs.bump.outputs.pr }}" --body "The post-deploy gate failed for this release and it was reverted: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Fail loudly
        run: |
          echo "::error::release ${{ needs.plan.outputs.sha }} failed the post-deploy gate and was reverted"
          exit 1
