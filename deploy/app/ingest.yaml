apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
spec:
  schedule: "17 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest
        spec:
          restartPolicy: Never
          serviceAccountName: ingest
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: config
              configMap:
                name: widedoor-config
          containers:
            - name: ingest
              image: ghcr.io/auroq/cnh/widedoor:main
              imagePullPolicy: Always
              args: ["ingest"]
              env:
                - name: WIDEDOOR_ELASTICSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wide-door-es-elastic-user
                      key: elastic
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: deployment.environment=cnh,k8s.namespace.name=wide-door,k8s.pod.name=$(POD_NAME),k8s.cronjob.name=ingest
              volumeMounts:
                - name: config
                  mountPath: /etc/widedoor
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
