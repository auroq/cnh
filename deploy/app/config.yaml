apiVersion: v1
kind: ConfigMap
metadata:
  name: widedoor-config
data:
  config.yaml: |
    server:
      listen: ":8080"
    elasticsearch:
      url: http://wide-door-es-http:9200
      username: elastic
      sessions_index: sessions
      places_index: places
    ingest:
      places_file: /data/venue/places.yaml
      concurrency: 8
    telemetry:
      service_name: widedoor
