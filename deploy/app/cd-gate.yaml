apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd-gate
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-gate
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cd-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cd-gate
subjects:
  - kind: ServiceAccount
    name: cd-gate
    namespace: wide-door
