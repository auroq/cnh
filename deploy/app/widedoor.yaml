apiVersion: v1
kind: ServiceAccount
metadata:
  name: widedoor
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: widedoor
  labels:
    app.kubernetes.io/name: widedoor
spec:
  selector:
    app.kubernetes.io/name: widedoor
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: widedoor
  labels:
    app.kubernetes.io/name: widedoor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: widedoor
  progressDeadlineSeconds: 120
  progressDeadlineAbort: true
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widedoor
    spec:
      serviceAccountName: widedoor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: widedoor
      volumes:
        - name: config
          configMap:
            name: widedoor-config
      containers:
        - name: widedoor
          image: ghcr.io/auroq/cnh/widedoor:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          args: ["serve"]
          env:
            - name: WIDEDOOR_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wide-door-es-elastic-user
                  key: elastic
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=cnh,k8s.namespace.name=wide-door,k8s.pod.name=$(POD_NAME),k8s.workload.name=widedoor
          volumeMounts:
            - name: config
              mountPath: /etc/widedoor
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: widedoor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: widedoor
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: widedoor
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - widedoor.cnh.auroq.com
  rules:
    - backendRefs:
        - name: widedoor
          port: 80
