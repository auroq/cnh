apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wide-door
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/auroq/cnh.git
    targetRevision: main
    path: deploy/node
  destination:
    server: https://kubernetes.default.svc
    namespace: wide-door
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
