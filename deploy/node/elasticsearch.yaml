apiVersion: v1
kind: Service
metadata:
  name: wide-door-es-http
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wide-door-es-default
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  replicas: 1
  serviceName: wide-door-es-http
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.license.self_generated.type
              value: trial
            - name: xpack.ml.enabled
              value: "true"
            - name: xpack.ml.use_auto_machine_memory_percent
              value: "true"
            - name: node.store.allow_mmap
              value: "false"
            - name: xpack.ml.max_machine_memory_percent
              value: "40"
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wide-door-es-elastic-user
                  key: elastic
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 6Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS -u "elastic:$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          # readOnlyRootFilesystem is left unset: the ES image writes config/keystore under its install directory (accepted exception, ADR 0005).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 10Gi
