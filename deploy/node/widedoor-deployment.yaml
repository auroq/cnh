apiVersion: apps/v1
kind: Deployment
metadata:
  name: widedoor
  labels:
    app.kubernetes.io/name: widedoor
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: widedoor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widedoor
    spec:
      serviceAccountName: widedoor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: widedoor-config
      containers:
        - name: widedoor
          image: ghcr.io/auroq/cnh/widedoor:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          args: ["serve"]
          env:
            - name: WIDEDOOR_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wide-door-es-elastic-user
                  key: elastic
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=cnh,k8s.namespace.name=wide-door,k8s.pod.name=$(POD_NAME),k8s.workload.name=widedoor
            - name: WIDEDOOR_TELEMETRY_OTLP_ENDPOINT
              value: https://ingress.us-west-2.aws.dash0.com:4317
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: dash0-otlp
                  key: headers
          volumeMounts:
            - name: config
              mountPath: /etc/widedoor
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
